name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      # Same shape as scripts/test_wsl.sh. There is no display and no network
      # on a runner, so the mock driver and fake weather are what we test with.
      JIRI_DISPLAY_DRIVER: mock
      JIRI_FULLSCREEN: "false"
      JIRI_WIDTH: "480"
      JIRI_HEIGHT: "320"
      JIRI_WEATHER_FAKE: "true"
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        # tests/conftest.py puts src/ on sys.path, so no install step and no
        # PYTHONPATH are needed here. PYTHONPATH is only required to run the
        # jiri modules directly, as the CLI smoke step below does.
        run: python -m pytest tests/ -q

      - name: CLI smoke check
        env:
          PYTHONPATH: src
          JIRI_DB_PATH: data/jiri_ci.db
        run: |
          mkdir -p data
          rm -f "$JIRI_DB_PATH"
          python -m jiri.cli init-db
          python -m jiri.cli todo add "CI smoke todo" --due "2026-05-14 21:00"
          python -m jiri.cli todo list
          python -m jiri.cli todo done 1
          python -m jiri.cli note add "CI smoke note" --body "Notes work headless."
          python -m jiri.cli focus start --minutes 1 --title "CI smoke focus"
          python -m jiri.cli focus complete
          python -m jiri.ui.pygame_app
          python -m jiri.cli status
          python -m jiri.cli health
