[display]
driver = "pygame"
width = 480
height = 320
fullscreen = true
fps = 15
rotate_seconds = 20

[assistant]
name = "JIRI"
personality = "funny_sarcastic"
rage_mode_enabled = true

[weather]
provider = "open_meteo"
location = "auto"
# Optional fixed coordinates. Saved CLI location settings override these.
# latitude = 26.1167
# longitude = 88.85
refresh_minutes = 30
timeout_seconds = 3

# Run `python -m jiri.cli location search "your place" --country BD` then `location set 1`.
# Or run `python -m jiri.cli location set-coords --name "Home" --lat 26.1167 --lon 88.85`.

[database]
path = "data/jiri.db"
backup_dir = "backups"

[web]
host = "0.0.0.0"
port = 5000

[worker]
enabled = false
base_url = "http://pi-worker.local:5050"
timeout_seconds = 1

[performance]
max_ui_ram_mb = 250
max_web_ram_mb = 150
target_fps = 15
min_acceptable_fps = 10

[llm]
enabled = false
provider = "none"
model_path = ""
